<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>WebTube Music (powered by YouTube Music)</title>
<meta name="theme-color" content="#0f0f0f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="application-name" content="WebTube" />
<meta name="apple-mobile-web-app-title" content="WebTube" />
<meta name="description" content="WebTube Music and video player powered by YouTube Music and YouTube" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" href="/static/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/styles.css?v=12" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="#" id="brandHome"><span class="logo">▶</span><span id="brandLabel">WebTube Music <em>(powered by YouTube Music)</em></span></a>
  <div class="mode-switch" role="tablist" aria-label="Player mode">
    <button id="modeMusic" class="mode-btn active" role="tab" aria-selected="true">Music</button>
    <button id="modeYt" class="mode-btn" role="tab" aria-selected="false">YouTube</button>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <input id="q" type="text" placeholder="Search WebTube Music" autocomplete="off" />
    </div>
    <button id="searchBtn" title="Search">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    </button>
    <button id="mouseLockBtn" class="mlc-chip" type="button" title="Mouse lock remote — click to arm, then triple-click anywhere to lock your mouse and steer with the arrow keys">
      <span aria-hidden="true">🖱️</span><span class="mlc-state" id="mouseLockState">OFF</span>
    </button>
    <div id="recentPanel" class="recent hidden"></div>
  </div>
  <nav class="topnav">
    <a href="#" id="homeLink">Home</a>
    <a href="#" id="libLink">Library</a>
    <a href="/docs" target="_blank">API</a>
  </nav>
</header>

<div class="chips" id="chips">
  <button class="chip active" data-filter="">All</button>
  <button class="chip" data-filter="songs">Songs</button>
  <button class="chip" data-filter="videos">Videos</button>
  <button class="chip" data-filter="albums">Albums</button>
  <button class="chip" data-filter="artists">Artists</button>
  <button class="chip" data-filter="playlists">Playlists</button>
</div>

<div class="chips hidden" id="ytChips">
  <button class="chip active" data-filter="videos">Videos</button>
  <button class="chip" data-filter="songs">Songs</button>
</div>

<main id="main">
  <div id="status"></div>
  <div id="musicView">
    <section id="continue"></section>
    <section id="detail"></section>
    <section id="results"></section>
    <section id="home"></section>
  </div>
  <section id="youtubeView" class="hidden">
    <div id="ytHome"></div>
    <div id="ytResults"></div>
    <article id="ytWatch" class="hidden"></article>
  </section>
</main>

<div id="sheet" class="sheet hidden">
  <div class="sheet-video"><div id="ytplayer"></div></div>
  <div class="sheet-side">
    <div class="tabs">
      <button id="tabQueue" class="tab active">Up next</button>
      <button id="tabLyrics" class="tab">Lyrics</button>
    </div>
    <div id="upnext" class="pane"></div>
    <pre id="lyrics" class="pane hidden"></pre>
  </div>
</div>

<div id="player" class="player hidden">
  <img id="ptumb" alt="" />
  <div class="p-meta">
    <div id="nowPlaying">Nothing playing</div>
    <div id="nowSub"></div>
  </div>
  <div class="p-btns">
    <button id="watchBtn" title="Show video">▶ Video</button>
    <button id="upnextBtn" title="Queue">☰ Queue</button>
    <button id="lyricsBtn" title="Lyrics">♫ Lyrics</button>
    <button id="hideBtn" title="Close">✕</button>
  </div>
</div>

<div id="ctxmenu" class="ctx hidden">
  <button id="ctxNext">▶&nbsp; Play next</button>
  <button id="ctxAdd">＋&nbsp; Add to playlist</button>
</div>

<div id="plmodal" class="modal hidden">
  <div class="modal-box">
    <h3>Add to playlist</h3>
    <div id="pltarget" class="pltarget"></div>
    <div id="pllist"></div>
    <div class="plnew">
      <input id="plname" placeholder="New playlist name" maxlength="60" />
      <button id="plcreate">Create</button>
    </div>
    <button id="plclose" class="btn-ghost">Close</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
}
</script>
<script src="/static/app.js?v=12"></script>
</body>
</html>
