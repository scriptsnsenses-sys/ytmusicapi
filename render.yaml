# Render Blueprint — one-click deploy of WebTube.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ytmusicapi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: YTMUSIC_LANGUAGE
        value: en
      # Optional auth: paste JSON or set a file path.
      # For private/library endpoints only. Leave blank for public catalogue.
      - key: YTMUSIC_AUTH
        sync: false
      - key: YTMUSIC_AUTH_FILE
        sync: false
      - key: YTMUSIC_LOCATION
        sync: false
      # Optional: YouTube cookies for InnerTube requests (bot-check mitigation).
      - key: YOUTUBE_COOKIE
        sync: false
      # Optional: PO token for InnerTube player requests on strict networks.
      - key: YOUTUBE_PO_TOKEN
        sync: false
